services:
  # Portas de host 8023/5436/6383 para nao colidir com outros servicos no mesmo host.
  api:
    build: .
    container_name: agente_bistro_api
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8023:8000"
    volumes:
      # Chave JSON da conta de servico do Google Calendar (GOOGLE_CREDENTIALS_PATH no .env) -
      # somente leitura, pasta fora do controle de versao (ver .gitignore).
      - ./credenciais:/srv/credenciais:ro
    depends_on:
      - postgres
      - redis
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agente_bistro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: agente_bistro
    volumes:
      - agente_bistro_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5436:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6383:6379"

volumes:
  agente_bistro_pgdata:
